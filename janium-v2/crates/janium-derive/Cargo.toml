[package]
name = "janium-derive"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
proc-macro = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
deluxe = "0.5"
janium-derive-core = { workspace = true, features = ["assertions"] }
proc-macro2 = "1.0.93"
quote = "*"
syn = { version = "2", features = ["full"] }
