[workspace]
members = ["crates/*"]
default-members = ["crates/janium"]
resolver = "3"
package.edition = "2024"
package.version = "0.1.0"
package.publish = false
package.rust-version = "1.92.0"

[profile.release]
debug = true

[workspace.dependencies]
array_map = { version = "0.4", features = ["derive", "serde", "std"] }
# no need for the tempfile feature right now
gql = { package = "async-graphql", version = "7.0.17", default-features = false, features = [
  "email-validator",
  "playground",
  "graphiql",
  "chrono",
  "uuid",
] }
gql-axum = { package = "async-graphql-axum", version = "7.0.17" }
arc-swap = "1.7.1"
argon2 = "0.5"
async-trait = "0.1"
aws-config = { version = "1.8.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.103.0"
aws-sdk-sesv2 = "1.94.0"
aws-sdk-sns = "1.42.0"
aws-sdk-sqs = "1.81.0"
automator = { path = "crates/automator" }
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = "0.8"
backtrace = "0.3.76"
base64ct = { version = "1.8.0", features = ["alloc"] }
bollard = { version = "0.20.1" }
brotli = "8.0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.37", features = ["derive", "env"] }
compact_str = { version = "0.9.0", features = ["serde", "sqlx-postgres"] }
container-service = { path = "crates/container-service" }
csv = "1.3.1"
dashmap = "6"
emojis = "0.8"
enigo = { version = "0.6.1", features = ["serde"] }
equivalent = "1.0.2"
futures = "0.3"
headers = "0.3.9"
http = "1"
hyper = { version = "1", features = ["full"] }
hyper-proxy = "0.9.1"
hyper-util = { version = "0.1", features = ["full"] }
iddqd = "0.3.8"
indexmap = { version = "2.10.0", features = ["serde"] }
is_not = "0.1.0"
janium-actors = { path = "crates/actors" }
janium-derive = { path = "crates/janium-derive" }
janium-derive-core = { path = "crates/janium-derive-core" }
jemallocator = "0.5"
jiff = { version = "0.2.15", features = ["serde"] }
jiff-sqlx = { version = "0.1", features = ["postgres"] }
jsonwebtoken = { version = "10.0", features = ["rust_crypto"] }
lease = { version = "0.5.2", features = ["async"] }
lettre = { version = "0.11.7", default-features = false, features = [
  "builder",
  "tokio1-rustls-tls",
] }
liquid = { version = "0.26.11", features = ["liquid-lib"] }
mail-parser = "0.11.0"
mimalloc = "0.1.47"
openai-api-rs = { version = "9.0.0", default-features = false, features = [
  "rustls",
] }
ormlite = { version = "0.24", features = ["json", "uuid", "postgres"] }
parking_lot = { version = "0.12", features = ["send_guard", "arc_lock"] }
petgraph = "0.8.2"
proc-macro2 = { version = "1.0.95", features = ["proc-macro"] }
quick_cache = "0.6.14"
quote = { version = "1.0.26", features = ["proc-macro"] }
rand = "0.10.0"
rand_chacha = "0.10.0"
regex = "1.11.1"
reqwest = { version = "0.13.2", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "stream",
] }
rustls = { version = "0.23.36", default-features = false, features = ["ring"] }
rustls-acme = { version = "0.15.1", default-features = false, features = [
  "axum",
  "ring",
  "webpki-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# serde_with = { version = "3", features = ["hex", "macros", "alloc"] }
smallvec = { version = "1.15.1", features = ["serde", "union"] }
sqlx = { version = "0.8.6", default-features = false, features = [
  "macros",
  "postgres",
  "chrono",
  "uuid",
  "json",
  "runtime-tokio-rustls",
] }
strum = { version = "0.27.2", features = ["derive"] }
syn = { version = "2", features = [
  "full",
  "extra-traits",
  "derive",
  "extra-traits",
  "full",
  "parsing",
  "printing",
  "proc-macro",
  "visit",
  "quote",
  "clone-impls",
] }
tap = "1"
testcontainers = { version = "0.27" }
thirtyfour = { version = "0.36.1", features = ["tokio-multi-threaded"] }
thiserror = "2"
tiny-keccak = { version = "2.0.2", features = ["sha3"] }
tokio = { version = "1.46.1", features = [
  "full",
  "parking_lot",
  "net",
  "io-util",
] }
tokio-tungstenite = { version = "0.28", features = [
  "rustls-tls-native-roots",
  "rustls-tls-webpki-roots",
] }
tower-cookies = "0.11.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "tracing-log",
] }
url = "2.5.7"
uuid = { version = "1.17", features = ["v4", "v7", "serde"] }
uuid-shuffler = { path = "crates/uuid-shuffler" }
